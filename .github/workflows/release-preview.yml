name: Publish preview packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag matching package.json
        required: true
        default: v0.1.2
permissions:
  contents: read
concurrency:
  group: preview-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun scripts/ci-release.ts prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
  build:
    needs: prepare
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            args: --mac zip --arm64
          - os: windows-latest
            target: win
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: ./native/bin/localshare-input.exe --self-test
        if: runner.os == 'Windows'
      - run: native/bin/localshare-input --self-test
        if: runner.os == 'macOS'
      - run: bun test
      - run: bunx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: bun run verify:mac
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-${{ inputs.tag }}-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error
      - run: bun scripts/ci-release.ts upload
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun scripts/ci-release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
